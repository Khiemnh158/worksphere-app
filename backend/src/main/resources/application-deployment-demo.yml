server:
  port: 8080
spring:
  jpa:
    hibernate:
      ddl-auto: validate
worksphere:
  jwt:
    secret: ${WORKSPHERE_JWT_SECRET}
  web-demo:
    enabled: ${WORKSPHERE_WEB_DEMO_ENABLED:false}
  mail:
    local-enabled: ${WORKSPHERE_MAIL_LOCAL_ENABLED:false}
    local-path: ${WORKSPHERE_MAIL_LOCAL_PATH:/var/lib/worksphere/mail}
management:
  server:
    port: 9091
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
